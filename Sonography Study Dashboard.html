<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1418;--card:#18222a;--ink:#e8eff4;--mut:#93a6b4;--acc:#4fc3cc;--accsoft:#173a3f;--ok:#4fcf97;--bad:#ff8a6d;--line:#2a3a45}}
:root[data-theme="dark"]{--bg:#0e1418;--card:#18222a;--ink:#e8eff4;--mut:#93a6b4;--acc:#4fc3cc;--accsoft:#173a3f;--ok:#4fcf97;--bad:#ff8a6d;--line:#2a3a45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.35rem;margin:6px 0 2px;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:0 0 8px}
.sub{color:var(--mut);margin:0 0 14px;font-size:.92rem}
nav{display:flex;gap:6px;margin:12px 0;overflow-x:auto}
nav button{flex:1;min-width:0;padding:10px 2px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
nav button[aria-current="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--accsoft);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.5rem;line-height:1.1}
.stat span{font-size:.8rem;color:var(--mut)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .3s}
.row{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;margin:10px 0 4px}
button.main{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:700;cursor:pointer;margin-top:8px}
button.alt{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.deckrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.fc{min-height:210px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;font-size:1.15rem}
.fc small{color:var(--mut);font-size:.8rem;margin-bottom:10px}
.fc .hook{margin-top:12px;font-size:.92rem;color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.good{background:var(--ok);color:#fff;border:0}.again{background:var(--bad);color:#fff;border:0}
.opt{display:block;width:100%;text-align:left;margin:8px 0}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.note{background:var(--accsoft);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.93rem}
label.ck{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
label.ck input{width:22px;height:22px;margin-top:2px;accent-color:var(--acc)}
.tm{font-variant-numeric:tabular-nums;font-weight:700}
.unit{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--card)}
.unit[open]{border-color:var(--acc)}
.unit summary{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;cursor:pointer;list-style:none}
.unit summary span{color:var(--mut);font-size:.88rem;white-space:nowrap}
.unit .ub{padding:0 14px 14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lib p{margin:0 0 12px}
.lib a{color:var(--acc);font-weight:600}
.opt.sel{border-color:var(--acc);background:var(--accsoft)}
button:disabled{opacity:.45;cursor:default}
:root[data-theme="rainbow"]{color-scheme:light;--bg:#fff6fb;--card:#fff;--ink:#241238;--mut:#5d4a78;--acc:#7c3aed;--accsoft:#f4e9ff;--ok:#15803d;--bad:#be123c;--line:#e9d5ff}

:root[data-theme="rainbow"] button.main,:root[data-theme="rainbow"] nav button[aria-current="true"]{background:linear-gradient(90deg,#dc2626,#c2410c,#a16207,#15803d,#1d4ed8,#6d28d9);border-color:transparent;color:#fff}
:root[data-theme="rainbow"] .bar i{background:linear-gradient(90deg,#ef4444,#f97316,#eab308,#22c55e,#3b82f6,#8b5cf6)}

:root[data-theme="rainbow"] .unit:nth-of-type(6n+4){border-left:6px solid #22c55e}
:root[data-theme="rainbow"] .unit:nth-of-type(6n+5){border-left:6px solid #3b82f6}
:root[data-theme="rainbow"] .unit:nth-of-type(6n){border-left:6px solid #8b5cf6}
:root[data-theme="rainbow"] nav button:nth-child(1){border-bottom:4px solid #ef4444}
:root[data-theme="rainbow"] nav button:nth-child(2){border-bottom:4px solid #f97316}
:root[data-theme="rainbow"] nav button:nth-child(3){border-bottom:4px solid #eab308}
:root[data-theme="rainbow"] nav button:nth-child(4){border-bottom:4px solid #22c55e}
:root[data-theme="rainbow"] nav button:nth-child(5){border-bottom:4px solid #3b82f6}
#th{padding:8px 12px;font-size:.82rem;white-space:nowrap}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
</style>

var C=[
["Physics","What kind of wave is sound?","A mechanical, longitudinal wave: particles vibrate back and forth, and it needs a medium.",""],
["Physics","What frequency counts as ultrasound, and what range do diagnostic scanners use?","Above 20 kHz. Diagnostic scanners typically run about 2 to 18 MHz.",""],
["Physics","Name the 7 parameters of sound waves.","Period, frequency, amplitude, power, intensity, wavelength, speed.","Pam Found Another Pretty Interesting Wavy Sound"],
["Physics","With a given transducer, which wave parameters can the sonographer adjust?","Only the initial amplitude, power, and intensity (the strength ones).","Strength you can set. Speed and timing you can’t."],
["Physics","Which parameters can’t the sonographer adjust?","Period, frequency, wavelength, and speed. (Frequency is fixed for a given transducer, though multi-frequency probes let you choose one.)",""],
["Physics","What determines the period and frequency of a wave?","The sound source only (the transducer), not the tissue.",""],
["Physics","What determines the speed of sound?","The medium (tissue) only. It changes only when sound moves into a different tissue.",""],
["Physics","What determines wavelength?","Both the source and the medium.",""],
["Physics","Wave equation?","Speed = frequency × wavelength (v = fλ).",""],
["Physics","Speed of sound in soft tissue?","1,540 m/s. Rough order: lung 500, fat 1,450, muscle 1,600, bone 3,500 m/s.","Fastest in solids, slower in liquids, slowest in gases"],
["Physics","How is intensity calculated, and in what units?","Intensity = power ÷ area, in W/cm².",""],
["Physics","How are power and amplitude related?","Power is proportional to amplitude squared.",""],
["Physics","Higher vs lower frequency: what’s the trade-off?","Higher frequency gives better resolution but less depth. Lower frequency goes deeper with less detail.","High = Detail, Low = Deep"],
["Physics","Which frequencies suit superficial vs deep structures?","Superficial (muscle, tendon, breast, testes): about 7 to 18 MHz. Deep (liver, kidney): about 1 to 6 MHz.",""],
["Physics","Why does a shorter wavelength improve image quality?","It gives finer detail. Higher-frequency transducers produce shorter wavelengths.",""],
["Physics","What happens to PRF as imaging depth increases?","PRF decreases. Deeper means a longer round trip, so fewer pulses per second.","Deep = Drop"],
["Physics","What is duty factor?","The fraction of time the transducer is actually producing sound: pulse duration ÷ pulse repetition period.",""],
["Physics","What mainly determines axial resolution?","Spatial pulse length (and pulse duration). Shorter pulses give better axial resolution.",""],
["Machine","What does the piezoelectric effect mean?","Certain materials make a voltage when deformed. The reverse effect: they change shape when voltage is applied.",""],
["Machine","What is PZT?","Lead zirconate titanate, the man-made ceramic used as the active element (crystal) in transducers.",""],
["Machine","What does the backing (damping) material do?","Shortens the ringing of the pulse, which improves axial resolution.",""],
["Machine","What does the matching layer do, and how thick is it?","Improves sound transfer between the crystal and the body. One-quarter wavelength thick. The PZT element is one-half wavelength thick.",""],
["Machine","Why do we use gel?","Sound doesn’t travel through air, so gel improves transfer between the transducer and skin.",""],
["Machine","What is time gain compensation (TGC)?","Selective amplification by depth so equal reflectors look equally bright, correcting for attenuation.",""],
["Machine","Name the 5 receiver functions.","Amplification, compensation, rejection, compression, demodulation. (Order varies by textbook.)","A Cat Ran Close Down"],
["Machine","What do A-mode, B-mode, and M-mode show?","A: spikes of echo amplitude by depth. B: brightness dots (the gray-scale image). M: motion of interfaces over time (echocardiography).",""],
["Images","Hyperechoic vs hypoechoic vs anechoic vs isoechoic?","Hyper: brighter than surroundings. Hypo: darker. Anechoic: no echoes. Iso: same as surroundings.","Hyper = High, Hypo = Low"],
["Images","Heterogeneous vs homogeneous?","Heterogeneous: mixed echo texture. Homogeneous: uniform texture throughout.",""],
["Images","What is posterior acoustic enhancement?","Brighter echoes behind a structure that transmits sound well. Classic for fluid-filled cysts.","Fluid = Free pass"],
["Images","What causes posterior acoustic shadowing?","Strong reflection and absorption, so little sound gets through. Seen behind ribs and calcified masses.",""],
["Images","What is reverberation?","Repeated echoes between strong reflectors in close contact, a common artifact.",""],
["Vascular","What is the Doppler effect in blood flow?","Moving red blood cells shift the frequency of reflected sound. The shift tells you velocity and flow character.","Train whistle"],
["Vascular","Best Doppler angle for vascular duplex?","45 to 60 degrees. Above 60 gives large velocity errors, and 90 gives little to no shift.","60 or below, let it flow. At 90, no show."],
["Vascular","What is the Nyquist limit?","Half the pulse repetition frequency (PRF).",""],
["Vascular","What is aliasing and how can you reduce it?","The spectral peak wraps to the other side of the baseline. Raise the scale/PRF, shift the baseline, use a lower-frequency probe, or use CW Doppler.",""],
["Vascular","Which Doppler mode can’t alias?","Continuous-wave (CW).",""],
["Vascular","Two duplex signs of a stenosis?","Focal acceleration of velocity at the narrowing, plus turbulence just after it.",""],
["Physics","How are period and frequency related?","They are reciprocals: period = 1 ÷ frequency. Higher frequency means a shorter period.",""],
["Physics","What does a 3 dB change mean?","A doubling (+3 dB) or halving (−3 dB) of power or intensity. 10 dB is ×10 or ÷10.","3 = twice, 10 = ten times"],
["Physics","Attenuation rule of thumb in soft tissue?","About 0.5 dB per cm per MHz one way. Higher frequency means more attenuation.",""],
["Physics","What are the three parts of attenuation?","Absorption (turned into heat, the largest part), scattering, and reflection.",""],
["Physics","How is acoustic impedance calculated?","Impedance = density × speed of sound. Units: rayls.",""],
["Physics","What decides how much sound reflects at a boundary?","The difference in acoustic impedance between the two media. A bigger mismatch means a stronger echo and less transmission.","Mismatch = Mirror"],
["Physics","Why is it hard to image through bone or air?","Their impedance differs hugely from soft tissue, so nearly all sound reflects. Gel removes the air gap at the skin.",""],
["Physics","What is refraction and when does it happen?","Bending of the sound path. It needs oblique incidence and different speeds in the two media (Snell’s law).","Angle + speed change"],
["Physics","What is the pulse repetition period?","The time from the start of one pulse to the start of the next (on time plus listening time). Deeper imaging makes it longer.",""],
["Physics","How do you calculate spatial pulse length?","SPL = wavelength × number of cycles in the pulse. Shorter SPL means better axial resolution.",""],
["Physics","Axial resolution formula and its other names?","Axial resolution = spatial pulse length ÷ 2. Other names: longitudinal, range, radial, depth.","LARRD"],
["Physics","Lateral resolution: other names and what limits it?","Also called angular, transverse, azimuthal. It equals the beam width, so it is best at the focus.","LATA"],
["Physics","What affects near field length and divergence?","A larger crystal and higher frequency give a longer near field and less far-field divergence.",""],
["Machine","What sets a transducer’s operating frequency?","Crystal thickness (half a wavelength) and the speed of sound in the crystal. Thinner crystal means higher frequency.",""],
["Machine","What does more damping do?","Shorter pulse, wider bandwidth, lower Q factor. Better axial resolution but lower sensitivity.",""],
["Machine","What is tissue harmonic imaging?","The system listens at twice the transmitted frequency, which builds up in tissue. It cuts artifacts and noise and sharpens the image.",""],
["Machine","Output power vs receiver gain: which changes patient exposure?","Output power does. Gain only amplifies returning echoes.","Output goes Out to the patient"],
["Machine","What lowers frame rate?","Greater depth, more focal zones, higher line density, or a wider sector.",""],
["Images","What is mirror image artifact?","A strong curved reflector (like the diaphragm) duplicates a structure deeper than the real one.",""],
["Images","What is comet tail artifact?","A tight trail of reverberations from closely spaced strong reflectors, such as metal or gas bubbles.",""],
["Vascular","Doppler equation in words?","Frequency shift = 2 × transmit frequency × velocity × cosine of the angle ÷ speed of sound.","cos 0 = 1, cos 90 = 0"],
["Vascular","Name the four types of Doppler.","Continuous wave, pulsed wave, color flow, and power Doppler.",""],
["Vascular","How does power Doppler differ from color Doppler?","Power shows presence and strength of flow, not direction or velocity. It is more sensitive to slow flow and does not alias.",""],
["Vascular","What does spectral broadening indicate?","A wide range of velocities at once: turbulent or disturbed flow, as just past a stenosis.",""],
["Safety","What does ALARA mean?","As Low As Reasonably Achievable: use the least output and scan time that still answers the clinical question.",""],
["Safety","What do MI and TI estimate?","Mechanical index estimates cavitation risk. Thermal index estimates tissue heating potential.","M = Mechanical bubbles, T = Temperature"],
["Safety","What is a tissue-equivalent phantom used for?","Quality assurance: checking resolution, depth calibration, and the dead zone.",""],
["Safety","What is the dead zone?","The region just under the transducer where echoes can’t be imaged reliably.",""],
["Exam","When should you start your study schedule?","At least 3 to 4 weeks before test day, at the time of day you are most alert.",""],
["Exam","How should you handle questions you’re unsure of?","Eliminate clearly wrong choices, pick from what remains, pace yourself, and move on if stuck. Keep your first answer unless you are sure it is wrong.",""],
["Machine", "What is spatial compounding?", "The system combines images made from several beam-steering angles into one. It reduces speckle and some artifacts and improves contrast, but lowers frame rate.", ""],
["Machine", "What does persistence do?", "It averages several frames over time. The image looks smoother and less noisy, but temporal resolution drops.", "More persistence = smoother but slower"],
["Machine", "Dynamic range and compression: what is the trade-off?", "Compression squeezes the huge range of echo strengths onto the display. A lower dynamic range gives higher contrast but fewer gray shades.", ""],
["Machine", "What is extended field of view (panoramic) imaging?", "Adjacent frames are stitched together as you slide the probe, to show a structure larger than one image.", ""],
["Physics", "What is elevational resolution?", "Slice thickness: resolution perpendicular to the image plane. It improves with elevational focusing and 1.5D or 2D arrays. Poor slice thickness causes slice-thickness artifact.", ""],
["Vascular", "What does the Doppler wall filter do?", "It removes low-frequency, high-amplitude signals from slow-moving walls and tissue. Set too high, it can erase real slow flow.", ""],
["Vascular", "What is color priority?", "The setting that decides whether color or gray scale is shown at a pixel, based on the strength of the gray-scale echo. It stops color from bleeding over bright tissue.", ""],
["Vascular", "What is tissue Doppler?", "It measures the velocity of tissue motion (such as heart muscle). It keeps slow, strong signals, the opposite of what the wall filter removes. Key in echocardiography.", ""],
["Machine", "What are ultrasound contrast agents?", "Tiny gas microbubbles that greatly increase echoes. They are best imaged at low mechanical index, because high output can burst the bubbles.", ""]
];

["With a given transducer, which can the sonographer adjust?",["Frequency","Period","Initial power","Wavelength"],2,"Initial amplitude, power, and intensity are adjustable. The others are set by the source or medium."],
["Speed of sound in soft tissue is about:",["330 m/s","1,540 m/s","3,500 m/s","500 m/s"],1,"1,540 m/s is the standard soft tissue value."],
["Raising transducer frequency generally gives:",["More depth, less detail","Better detail, less depth","No change in detail","Longer wavelength"],1,"High frequency means better resolution but less penetration."],
["Posterior acoustic enhancement is classic behind:",["Ribs","Calcified masses","A fluid-filled cyst","Bone"],2,"Fluid attenuates little, so echoes behind it are brighter."],
